name: Publish edition

# Triggered by push to publish/submissions/* (scripts/submit_edition.py on parent via gh).
# No workflow_dispatch — avoids unvalidated manual inputs and shell injection.

on:
  push:
    branches:
      - "publish/submissions/**"

concurrency:
  group: publish-edition
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DATABUDDY_API_KEY: ${{ secrets.DATABUDDY_API_KEY }}
      LOOT_SITE_URL: https://loot-gaming-roundup.vercel.app
      SUBMISSION_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch submission commit
        run: git fetch origin "$SUBMISSION_SHA" && git cat-file -e "$SUBMISSION_SHA^{commit}"

      - name: Resolve submission metadata
        id: meta
        env:
          SUBMISSION_SHA: ${{ github.sha }}
        run: |
          python3 -m publish.resolve_submission \
            --commit "$SUBMISSION_SHA" \
            --work-dir . \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate bundle (strict, content paths only)
        env:
          EDITION_DATE: ${{ steps.meta.outputs.edition_date }}
          EXPECTED_JSON_SHA256: ${{ steps.meta.outputs.json_sha256 }}
          EXPECTED_PNG_SHA256: ${{ steps.meta.outputs.png_sha256 }}
        run: |
          python3 -m publish.validate --edition-date "$EDITION_DATE" --root . --print-hashes
          test "$(sha256sum "${EDITION_DATE}.json" | awk '{print $1}')" = "$EXPECTED_JSON_SHA256"
          test "$(sha256sum "x/${EDITION_DATE}.png" | awk '{print $1}')" = "$EXPECTED_PNG_SHA256"

      - name: Build site
        run: python3 build.py --all

      - name: Commit and push to main
        id: push
        env:
          EDITION_DATE: ${{ steps.meta.outputs.edition_date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          git add "${EDITION_DATE}.json" "${EDITION_DATE}.html" "x/${EDITION_DATE}.png" \
            index.html archive.html sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to commit (idempotent — already published)"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "publish: ${EDITION_DATE} edition + Artist haul PNG"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "publish_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify production (HTML + JSON + PNG)
        id: verify
        if: steps.push.outputs.pushed == 'true'
        env:
          EDITION_DATE: ${{ steps.meta.outputs.edition_date }}
          DATE_LABEL: ${{ steps.meta.outputs.date_label }}
          EXPECTED_PNG_SHA256: ${{ steps.meta.outputs.png_sha256 }}
          PUBLISH_SHA: ${{ steps.push.outputs.publish_sha }}
        run: |
          set -euo pipefail
          if [ "${{ steps.push.outputs.pushed }}" != "true" ]; then
            echo "Skipped production verify (no new main commit)."
            echo "outcome=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 -m publish.verify_production \
            --edition-date "$EDITION_DATE" \
            --expected-date-label "$DATE_LABEL" \
            --expected-png-sha256 "$EXPECTED_PNG_SHA256"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "outcome=ok" >> "$GITHUB_OUTPUT"
            echo "Published commit on main: $PUBLISH_SHA (left in place; verify OK)."
            exit 0
          fi
          if [ "$code" -eq 2 ]; then
            echo "outcome=pending_deploy" >> "$GITHUB_OUTPUT"
            echo "::error::Production not fully visible yet (Vercel deploy pending). Main commit $PUBLISH_SHA was NOT reverted. Re-check / and /$EDITION_DATE, then re-run verify or publish workflow from submission ref."
            exit 1
          fi
          echo "outcome=content_error" >> "$GITHUB_OUTPUT"
          echo "::error::Production content check failed after publish $PUBLISH_SHA. Main was NOT auto-reverted (may include unrelated concurrent commits). Fix content or revert $PUBLISH_SHA explicitly if needed."
          exit 1

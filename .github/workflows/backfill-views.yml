name: Backfill views

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/backfill-views.request

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      DATABUDDY_API_KEY: ${{ secrets.DATABUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Backfill Databuddy views and rebuild HTML
        run: python3 build.py --backfill-views --refresh-views

      - name: Commit snapshot updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json *.html archive.html index.html sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: backfill views snapshots from Databuddy"
          git push

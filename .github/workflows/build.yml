name: Build site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABUDDY_API_KEY: ${{ secrets.DATABUDDY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate HTML from JSON
        run: python3 build.py --all
      - name: Publish validation tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
